name: X86-OpenWrt

on:
  workflow_dispatch:
    inputs:
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware (false = 只准备并校验配置, 不编译)"
        required: false
        type: boolean
        default: true

# 默认不给任何权限, 由 job 按需声明
permissions: {}

# 同一时间只跑一个构建, 不取消已经在跑的
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    uses: ./.github/workflows/OpenWrt-Matrix.yml
    # 被调用的工作流权限不能超过这里给的范围
    # Matrix 里 build 只用只读, 只有 release 任务用 contents: write
    permissions:
      contents: write
    with:
      upload_source: ${{ inputs.upload_source }}
      build_firmware: ${{ inputs.build_firmware }}
