name: X86-OpenWrt

on:
  workflow_dispatch:
    inputs:
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware"
        required: false
        type: boolean
        default: true
      badge_status:
        description: "badge status var（keep empty）"
        required: false
        type: string
        default: ''

# 默认不给任何权限, 由各 job 按需声明
permissions: {}

# 避免多个构建同时跑, 也不会取消已经在跑的构建
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id && inputs.badge_status == ''
    uses: ./.github/workflows/OpenWrt-Matrix.yml
    # 被调用的工作流权限不能超过这里给的范围
    # 先按"发布固件 + 同步徽章"给, 看完 Matrix 文件后再收紧
    permissions:
      contents: write
      actions: write
    with:
      targets: "X86"
      upload_source: ${{ inputs.upload_source }}
      build_firmware: ${{ inputs.build_firmware }}

  sync_badge:
    if: inputs.badge_status != ''
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BADGE_STATUS: ${{ inputs.badge_status }}
    steps:
      - name: Sync badge status
        run: |
          echo "Syncing badge status ...( ${BADGE_STATUS} )"
          if [ "${BADGE_STATUS}" = "success" ]; then
            exit 0
          else
            exit 1
          fi
