# Reusable workflow: 构建 X86 官方 OpenWrt 25.12 (纯 nftables)
name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      upload_source:
        required: false
        type: boolean
        default: false
      build_firmware:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware (false = 只准备并校验配置, 不编译)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: x86-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      # 以下变量在 仓库 Settings -> Secrets and variables -> Actions -> Variables 中设置
      # 第三方包的 commit 必须是完整 40 位, 缺失或格式不对会让构建立刻失败
      MWAN3_COMMIT: ${{ vars.MWAN3_COMMIT }}
      LUCI_MWAN3_COMMIT: ${{ vars.LUCI_MWAN3_COMMIT }}
      PW2_COMMIT: ${{ vars.PW2_COMMIT }}
      PW_PKGS_COMMIT: ${{ vars.PW_PKGS_COMMIT }}
      MOSDNS_COMMIT: ${{ vars.MOSDNS_COMMIT }}
      GOLANG_COMMIT: ${{ vars.GOLANG_COMMIT }}
      # 可选: 留空则自动取 25.12 最新正式 tag
      OPENWRT_REF: ${{ vars.OPENWRT_REF }}
      OPENWRT_COMMIT: ${{ vars.OPENWRT_COMMIT }}
    outputs:
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Show system info
        run: |
          echo "CPU cores: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo

      - name: Check required variables
        run: |
          missing=0
          for v in MWAN3_COMMIT LUCI_MWAN3_COMMIT PW2_COMMIT PW_PKGS_COMMIT MOSDNS_COMMIT GOLANG_COMMIT; do
            val="${!v:-}"
            if ! [[ "$val" =~ ^[0-9a-f]{40}$ ]]; then
              echo "错误: 仓库变量 ${v} 未设置, 或不是 40 位 commit" >&2
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - name: Free disk space
        if: inputs.build_firmware
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get -qq clean
          df -h /
          avail="$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')"
          if [ "$avail" -lt 30 ]; then
            echo "警告: 可用空间只有 ${avail}GB, 完整编译可能不够"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -y -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools libelf-dev rsync swig unzip zlib1g-dev file wget \
            zstd xsltproc help2man intltool patch perl-modules pkg-config \
            libxml-parser-perl libthread-queue-any-perl jq quilt
          df -h

      - name: Get official OpenWrt source
        run: bash ./SCRIPTS/01_get_ready.sh

      - name: Prepare packages
        working-directory: openwrt
        run: |
          bash ../SCRIPTS/02_prepare_package.sh
          bash ../SCRIPTS/02_target_only.sh
          bash ../SCRIPTS/04_remove_upx.sh

      - name: Apply seed
        working-directory: openwrt
        run: cp -f ../SEED/X86/config.seed .config

      - name: Post-process
        working-directory: openwrt
        run: |
          bash ../SCRIPTS/03_convert_translation.sh
          bash ../SCRIPTS/05_create_acl_for_luci.sh -a

      - name: Make defconfig and verify nftables-only
        working-directory: openwrt
        env:
          # 在仓库变量里新建 STRICT_SEED=1, 可让 seed 与最终配置不一致直接失败
          STRICT_SEED: ${{ vars.STRICT_SEED || '0' }}
        run: |
          make defconfig
          bash ../SCRIPTS/07_verify_nft.sh

      - name: Export build info and audit files
        id: info
        run: |
          mkdir -p audit
          ref="$(git -C openwrt describe --tags --always)"
          commit="$(git -C openwrt rev-parse HEAD)"
          tag="x86-${ref}-$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          (cd openwrt && ./scripts/diffconfig.sh) > audit/diffconfig.txt
          cp openwrt/.config audit/full.config
          {
            echo "# Build info"
            echo "- OpenWrt: ${ref} (${commit})"
            echo "- mwan3: ${MWAN3_COMMIT}"
            echo "- luci-app-mwan3: ${LUCI_MWAN3_COMMIT}"
            echo "- passwall2: ${PW2_COMMIT}"
            echo "- passwall-packages: ${PW_PKGS_COMMIT}"
            echo "- luci-app-mosdns: ${MOSDNS_COMMIT}"
            echo "- openwrt/packages (lang/golang): ${GOLANG_COMMIT}"
            echo "- workflow commit: ${GITHUB_SHA}"
            echo "## Official feeds"
            for d in openwrt/feeds/*/; do
              if [ -d "${d}.git" ]; then
                echo "- $(basename "$d"): $(git -C "$d" rev-parse HEAD)"
              fi
            done
          } > audit/BUILD-INFO.md

      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: x86-audit
          path: audit/
          retention-days: 30
          if-no-files-found: error

      - name: Pack source (optional)
        if: inputs.upload_source
        run: tar -cf "openwrt-source-x86-${GITHUB_RUN_ID}.tar" openwrt

      - name: Upload source (optional)
        if: inputs.upload_source
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-source-x86-${{ github.run_id }}
          path: openwrt-source-x86-${{ github.run_id }}.tar
          retention-days: 5

      - name: Make download
        if: inputs.build_firmware
        working-directory: openwrt
        run: make download -j8

      - name: Check Go toolchain
        if: inputs.build_firmware
        working-directory: openwrt
        run: |
          norm() { case "$1" in *.*.*) echo "$1" ;; *) echo "$1.0" ;; esac; }
          # 官方 feeds 的 Go 版本: 优先取 make download 下载的 Go 源码包名里最高的版本(引导用的旧版本更低)
          have="$(find dl -maxdepth 1 -type f -name 'go[0-9]*.src.tar.*' -printf '%f\n' 2>/dev/null \
            | sed -n 's/^go\([0-9][0-9]*\.[0-9][0-9]*\(\.[0-9][0-9]*\)\{0,1\}\)\.src\.tar\..*/\1/p' | sort -V | tail -n1)"
          if [ -z "$have" ]; then
            # 备用: 读 golang 包 Makefile(官方按版本分目录: golang1.27/Makefile, 旧布局是 golang/Makefile), 取最高版本
            have="$(
              for mk in feeds/packages/lang/golang/golang*/Makefile; do
                [ -f "$mk" ] || continue
                mm="$(sed -nE 's/^GO_VERSION_MAJOR_MINOR[[:space:]]*:?=[[:space:]]*([0-9]+\.[0-9]+).*/\1/p' "$mk" | head -n1)"
                pp="$(sed -nE 's/^GO_VERSION_PATCH[[:space:]]*:?=[[:space:]]*([0-9]+).*/\1/p' "$mk" | head -n1)"
                if [ -n "$mm" ]; then echo "${mm}.${pp:-0}"; fi
              done | sort -V | tail -n1
            )"
          fi
          if [ -z "$have" ]; then
            echo "::warning::读不到官方 feeds 的 Go 版本, 跳过预检"
            grep -rn 'GO_VERSION' feeds/packages/lang/golang 2>/dev/null | head -n 10 || true
            exit 0
          fi
          have="$(norm "$have")"
          echo "官方 feeds 提供的 Go 版本: ${have}"
          bad=0
          checked=0
          while IFS= read -r f; do
            top="$(tar -tf "$f" 2>/dev/null | sed -n '1p')"
            top="${top%%/*}"
            req="$(tar -xOf "$f" "${top}/go.mod" 2>/dev/null | sed -n 's/^go[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -n1)"
            if [ -z "$req" ]; then
              echo "  $(basename "$f"): 读不到 go.mod, 跳过"
              continue
            fi
            req="$(norm "$req")"
            checked=$((checked + 1))
            if [ "$(printf '%s\n%s\n' "$req" "$have" | sort -V | head -n1)" = "$req" ]; then
              echo "  OK    $(basename "$f") 需要 Go >= ${req}"
            else
              echo "错误: $(basename "$f") 需要 Go >= ${req}, 但官方 feeds 只有 ${have}" >&2
              bad=1
            fi
          done < <(find dl -maxdepth 1 -type f \( -iname 'xray-core-*.tar.*' -o -iname 'sing-box-*.tar.*' \) | sort)
          if [ "$checked" -eq 0 ]; then
            echo "::warning::没有找到可核对的 xray-core / sing-box 源码包, 未能预检 Go 版本"
          fi
          if [ "$bad" -ne 0 ]; then
            echo "Go 版本不够, 继续编译必然失败, 已中止" >&2
            exit 1
          fi

      - name: Compile
        if: inputs.build_firmware
        working-directory: openwrt
        run: |
          # -k: 某个包失败后继续编译其他互不依赖的包, 一次运行就能看到所有失败的包
          if make -k -j"$(($(nproc) + 1))" 2>&1 | tee ../build-pass1.log; then
            exit 0
          fi
          echo "::error::首次编译失败, 下面单独重跑失败的包, 输出完整错误"
          mapfile -t failed < <(grep -oE 'ERROR: package/[^ ]+ failed to build' ../build-pass1.log | awk '{print $2}' | sort -u)
          if [ "${#failed[@]}" -eq 0 ]; then
            echo "没有解析到失败的包, 打印日志末尾:"
            tail -n 150 ../build-pass1.log
          fi
          for p in "${failed[@]}"; do
            echo "::group::重跑 ${p}"
            make "${p}/clean" >/dev/null 2>&1 || true
            make "${p}/compile" -j1 V=s 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done
          exit 1

      - name: Audit rootfs permissions
        if: inputs.build_firmware
        run: |
          roots=( openwrt/build_dir/target-*/root-* )
          if [ ! -d "${roots[0]:-}" ]; then
            echo "::warning::找不到 rootfs 目录, 跳过权限审计"
            exit 0
          fi
          root="${roots[0]}"
          echo "审计目录: $root"
          bad=0
          ww="$(find "$root" -type f -perm -0002 -print)"
          if [ -n "$ww" ]; then
            echo "错误: 存在全局可写文件:" >&2
            echo "$ww" >&2
            bad=1
          fi
          if [ -e "$root/etc/shadow" ]; then
            mode="$(stat -c '%a' "$root/etc/shadow")"
            if [ "$mode" != "600" ]; then
              echo "错误: /etc/shadow 权限为 ${mode}, 应为 600" >&2
              bad=1
            fi
          fi
          echo "--- setuid/setgid 文件(仅供人工审计) ---"
          find "$root" -type f \( -perm -4000 -o -perm -2000 \) -print || true
          echo "---"
          [ "$bad" -eq 0 ] || exit 1
          echo "rootfs 权限审计通过"

      - name: Organize files
        if: inputs.build_firmware
        run: |
          shopt -s nullglob
          out="$PWD/artifact"
          mkdir -p "$out"
          cd openwrt/bin/targets/x86/64
          imgs=( *squashfs-combined-efi.img.gz )
          if [ "${#imgs[@]}" -ne 1 ]; then
            echo "错误: 期望 1 个 squashfs-combined-efi 镜像, 实际 ${#imgs[@]} 个" >&2
            ls -l
            exit 1
          fi
          cp -- "${imgs[0]}" "$out/"
          cp -f -- *.manifest sha256sums *.buildinfo "$out/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/audit/BUILD-INFO.md" "$out/"
          cp "$GITHUB_WORKSPACE/audit/diffconfig.txt" "$out/"
          cd "$out"
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./
          ls -lh

      - name: Upload firmware
        if: inputs.build_firmware
        uses: actions/upload-artifact@v4
        with:
          name: x86-firmware
          path: artifact/
          retention-days: 7
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x86-failure-logs
          path: |
            build-pass1.log
            openwrt/logs/
            openwrt/.config
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: build
    if: inputs.build_firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: x86-firmware
          path: artifact

      - name: Verify checksums
        working-directory: artifact
        run: sha256sum -c SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # tag 已存在时 gh 会报错, 不会覆盖旧版本
          gh release create "$TAG" artifact/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenWrt x86 ${TAG}" \
            --notes-file artifact/BUILD-INFO.md
